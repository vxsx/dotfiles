set -g prefix C-a

# Allows us to use C-a a <command> to send commands to a TMUX session inside
# another TMUX session
bind-key a send-prefix

# appearance
set -g default-terminal "xterm-256color-italic"
set -ga terminal-overrides ',*256col*:Tc'
set -as terminal-overrides ',xterm*:sitm=\E[3m'

source-file ~/.dotfiles/tmux-statusline-dark.conf

# bind splits
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

bind-key C-\\ last-window

set -g automatic-rename off

# scrolling
set -g mouse on

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf


set-option -g base-index 1
set-window-option -g pane-base-index 1

# Use vim keybindings in copy mode
setw -g mode-keys vi

# bind-key -T copy-mode-vi v send -X begin-selection
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"


# don't wait for an escape sequence after hitting
# Esc. fixes insert mode exit lag in vim
set-option -s escape-time 10

set-option -g focus-events on

set -g history-limit 50000

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
# sidebar tracking Claude Code / Codex / OpenCode panes across sessions.
# prefix+e toggles it in this window, prefix+E everywhere.
set -g @plugin 'hiroppy/tmux-agent-sidebar'

# Sidebar layout. Must be set before tpm runs — the plugin only seeds these
# when unset, so a later `set` is ignored until the next server restart.
set -g @sidebar_width 34
set -g @sidebar_position left
set -g @sidebar_bottom_height 0          # 0 hides the Activity/Git panel entirely
# Hides the two top rows (status filter icons + repo/notices row).
# NOTE: local patch, not upstream — see ~/.dotfiles/patches/tmux-agent-sidebar/
set -g @sidebar_header off

# Sound for desktop notifications. Any name from /System/Library/Sounds:
# Basso Blow Bottle Frog Funk Glass Hero Morse Ping Pop Purr Sosumi
# Submarine Tink. Unset or `off` = silent. Read fresh on every hook fire,
# so changes take effect immediately with no sidebar restart.
# NOTE: local patch, not upstream — see ~/.dotfiles/patches/tmux-agent-sidebar/
set -g @sidebar_notification_sound Glass
# Which events notify (default: stop,notification,stop_failure,permission_denied)
# set -g @sidebar_notifications_events "notification,permission_denied"
# Clicking a notification jumps to the pane that raised it (needs
# `brew install terminal-notifier`; without it you get a plain banner).
# The terminal brought to the front defaults to whichever one the agent was
# started in, so this only needs setting to override or to disable with `off`.
# NOTE: local patch, not upstream — see ~/.dotfiles/patches/tmux-agent-sidebar/
# set -g @sidebar_notification_activate com.mitchellh.ghostty
# New windows follow the last explicit prefix+e / prefix+E choice instead of
# always opening a sidebar. `on` = always (upstream default), `off` = never.
# NOTE: `track` is a local patch — see ~/.dotfiles/patches/tmux-agent-sidebar/
set -g @sidebar_auto_create track
# set -g @sidebar_auto_create_delay 0.3  # if tmuxinator layouts get scrambled

# Sidebar palette, matched to whichever Solarized variant is active.
# darkmode.zsh re-sources this on appearance change; this line covers a tmux
# server that starts without a subsequent change firing.
if-shell 'defaults read -g AppleInterfaceStyle >/dev/null 2>&1' \
  'source-file ~/.dotfiles/tmux-sidebar-dark.conf' \
  'source-file ~/.dotfiles/tmux-sidebar-light.conf'

run '~/.tmux/plugins/tpm/tpm'
